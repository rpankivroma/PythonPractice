<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Share - Modern Cooking Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="logo">GourmetShare</a>
    <div id="nav-links" class="nav-links">
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="openModal('loginModal')" id="login-link">Login</a>
        <a href="#" onclick="openModal('registerModal')" id="register-link">Register</a>
        <a href="#" onclick="logout()" id="logout-link" style="display: none;">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="hero">
        <h1>Culinary Inspiration</h1>
        <p>Discover recipes created by home cooks and professional chefs from around the world.</p>
        <div class="chapter-filters" style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
            <button class="btn btn-outline" onclick="filterRecipes('')">All</button>
            <button class="btn btn-outline" onclick="filterRecipes('Meals')">Meals</button>
            <button class="btn btn-outline" onclick="filterRecipes('Breakfasts')">Breakfasts</button>
            <button class="btn btn-outline" onclick="filterRecipes('Dinners')">Dinners</button>
            <button class="btn btn-outline" onclick="filterRecipes('Desserts')">Desserts</button>
            <button class="btn btn-outline" onclick="filterRecipes('Drinks')">Drinks</button>
        </div>
    </div>
    
    <h2 class="section-title">Latest Recipes</h2>
    <div id="recipe-grid" class="grid">
        <!-- Recipes will be loaded here -->
    </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content small">
        <span class="close" onclick="closeModal('loginModal')">&times;</span>
        <h2>Welcome Back</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="Enter password" required>
                    <button type="button" class="show-password-btn" onclick="togglePassword('login-password')">Show</button>
                </div>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login</button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
                <a href="#" onclick="closeModal('loginModal'); openModal('forgotPasswordModal')" style="color: var(--primary); text-decoration: none;">Forgot Password?</a>
            </p>
        </form>
    </div>
</div>

<!-- Forgot Password Modal -->
<div id="forgotPasswordModal" class="modal">
    <div class="modal-content small">
        <span class="close" onclick="closeModal('forgotPasswordModal')">&times;</span>
        <h2>Reset Password</h2>
        <p style="color: var(--muted-foreground); margin-bottom: 1.5rem; font-size: 0.9rem;">Enter your email and new password to reset.</p>
        <form id="forgot-password-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="forgot-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="forgot-password" placeholder="Create a new password" required>
                    <button type="button" class="show-password-btn" onclick="togglePassword('forgot-password')">Show</button>
                </div>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Reset Password</button>
        </form>
    </div>
</div>

<!-- Register Modal -->
<div id="registerModal" class="modal">
    <div class="modal-content small">
        <span class="close" onclick="closeModal('registerModal')">&times;</span>
        <h2>Join Community</h2>
        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="reg-password" placeholder="Create a password" required>
                    <button type="button" class="show-password-btn" onclick="togglePassword('reg-password')">Show</button>
                </div>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Create Account</button>
        </form>
    </div>
</div>

<script src="static/js/auth.js"></script>
<script>
    function openModal(id) {
        document.getElementById(id).style.display = "block";
    }
    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    function togglePassword(id) {
        const input = document.getElementById(id);
        const btn = input.nextElementSibling;
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "Hide";
        } else {
            input.type = "password";
            btn.textContent = "Show";
        }
    }

    window.onclick = function(event) {
        if (event.target.className === 'modal') {
            event.target.style.display = "none";
        }
    }

    async function loadRecipes(chapter = '') {
        try {
            let url = `${API_URL}/recipes`;
            if (chapter) {
                url += `?chapter=${encodeURIComponent(chapter)}`;
            }
            const response = await fetch(url);
            const recipes = await response.json();
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '';
            
            if (recipes.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: var(--muted-foreground);">No recipes found in this chapter.</p>';
                return;
            }

            recipes.forEach(recipe => {
                const card = document.createElement('a');
                // Ensure link points to the correct static file served by Flask
                card.href = `recipe.html?id=${recipe.id}`;
                card.className = 'card';
                const priceDisplay = recipe.forSale && recipe.price ? `<span style="font-size: 1rem; font-weight: 700; color: var(--primary);">$${recipe.price.toFixed(2)}</span>` : '';
                card.innerHTML = `
                    <img src="${recipe.imageUrl}" class="card-img" onerror="this.src='/static/img/NoImageAvalible.png'" alt="No image">
                    <div class="card-content">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <span style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); font-weight: 600;">${recipe.chapter || 'Meals'}</span>
                            <span style="font-size: 0.8rem; color: var(--muted-foreground);">${recipe.difficulty}</span>
                        </div>
                        <h3>${recipe.title}</h3>
                        <p>${recipe.description}</p>
                        ${priceDisplay ? `<div style="margin-top: 0.75rem; display: flex; justify-content: space-between; align-items: center;">${priceDisplay}<span style="font-size: 0.75rem; background: var(--primary); color: white; padding: 0.25rem 0.5rem; border-radius: 4px;">For Sale</span></div>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error('Error loading recipes:', error);
        }
    }

    function filterRecipes(chapter) {
        // Update active state of buttons
        const buttons = document.querySelectorAll('.chapter-filters button');
        buttons.forEach(btn => {
            if (btn.textContent === (chapter || 'All')) {
                btn.style.backgroundColor = 'var(--primary)';
                btn.style.color = 'white';
            } else {
                btn.style.backgroundColor = 'transparent';
                btn.style.color = 'var(--primary)';
                btn.style.border = '1px solid var(--primary)';
            }
        });
        loadRecipes(chapter);
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        filterRecipes(''); // Load all recipes initially and set "All" as active
        
        // Setup forgot password form
        const forgotForm = document.getElementById('forgot-password-form');
        if (forgotForm) {
            forgotForm.onsubmit = async (e) => {
                e.preventDefault();
                const res = await apiRequest('/reset-password', 'POST', {
                    email: document.getElementById('forgot-email').value,
                    password: document.getElementById('forgot-password').value
                });
                
                if (res && !res.error) {
                    alert('Password reset successful! Please login with your new password.');
                    closeModal('forgotPasswordModal');
                    openModal('loginModal');
                } else if (res && res.error) {
                    alert(res.error);
                }
            };
        }
    });
</script>

</body>
</html>
