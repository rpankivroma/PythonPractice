{% extends "base.html" %}
{% block content %}
<h2>{{ recipe.title }}</h2>
<p>{{ recipe.content }}</p>

<h3>Коментарі</h3>
{% for c in recipe.comments %}
    <p>💬 {{ c.text }}</p>
{% endfor %}

<form method="post">
    <input name="comment" placeholder="Коментар">
    <button>Додати</button>
</form>
{% endblock %}
