<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe - Gourmet Share</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="logo">GourmetShare</a>
    <div id="nav-links" class="nav-links">
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="openModal('loginModal')" id="login-link">Login</a>
        <a href="#" onclick="openModal('registerModal')" id="register-link">Register</a>
        <a href="#" onclick="logout()" id="logout-link" style="display: none;">Logout</a>
    </div>
</nav>

<div class="container" id="recipe-container">
    <!-- Recipe details will be loaded here -->
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content small">
        <span class="close" onclick="closeModal('loginModal')">&times;</span>
        <h2>Welcome Back</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>
    </div>
</div>

<!-- Register Modal -->
<div id="registerModal" class="modal">
    <div class="modal-content small">
        <span class="close" onclick="closeModal('registerModal')">&times;</span>
        <h2>Join Community</h2>
        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Create Account</button>
        </form>
    </div>
</div>

<script src="static/js/auth.js"></script>
<script>
    function openModal(id) {
        document.getElementById(id).style.display = "block";
    }
    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    async function loadRecipe() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (!id) return;

        try {
            const response = await fetch(`${API_URL}/recipes/${id}`);
            const recipe = await response.json();
            const container = document.getElementById('recipe-container');
            
            container.innerHTML = `
                <div class="recipe-header">
                    <h1>${recipe.title}</h1>
                    <div class="recipe-meta">
                        <span>By <strong>${recipe.author}</strong></span>
                        <span>•</span>
                        <span>${recipe.cookingTime} Mins Cook Time</span>
                        <span>•</span>
                        <span>${recipe.difficulty} Difficulty</span>
                    </div>
                </div>

                <img src="${recipe.imageUrl}" class="recipe-hero-img" alt="${recipe.title}">

                <div class="recipe-content">
                    <div class="ingredients">
                        <h2 class="section-title">Ingredients</h2>
                        <ul class="ingredients-list">
                            ${recipe.ingredients.map(ing => `<li>${ing}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="steps">
                        <h2 class="section-title">Preparation</h2>
                        <ol class="steps-list">
                            ${recipe.steps.map(step => `<li>${step}</li>`).join('')}
                        </ol>
                    </div>
                </div>
            `;
        } catch (error) {
            console.error('Error loading recipe:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        loadRecipe();
    });
</script>

</body>
</html>
