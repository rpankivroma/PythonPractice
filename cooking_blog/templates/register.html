{% extends "base.html" %}

{% block content %}
<h2>Реєстрація</h2>

<form method="post">
    <input type="text" name="username" placeholder="Імʼя користувача" required>
    <input type="password" name="password" placeholder="Пароль" required>

    <button type="submit">Зареєструватись</button>
</form>

<p>
    Вже маєш акаунт?
    <a href="{{ url_for('login') }}">Увійти</a>
</p>
{% endblock %}
