{% extends "base.html" %}

{% block content %}

<form method="post">
    <input type="text" name="username" placeholder="Імʼя користувача" required>
    <input type="password" name="password" placeholder="Пароль" required>

    <button type="submit">Увійти</button>
</form>

<p>
    Немає акаунту?
    <a href="{{ url_for('register') }}">Зареєструватись</a>
</p>
{% endblock %}
